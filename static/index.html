<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-font="default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#181818">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=283aa713">
<link rel="alternate icon" type="image/png" sizes="16x16" href="/static/favicon-16.png?v=283aa713">
<link rel="alternate icon" type="image/png" sizes="32x32" href="/static/favicon-32.png?v=283aa713">
<title>Jacquard 织流</title>
<link rel="stylesheet" href="/static/fonts/fonts.css">
<link rel="stylesheet" href="/static/style.css?v=283aa713">
<script>
/* 先落外观属性再渲染，避免深色模式闪白 */
window.__FF_BOOT = fetch('/api/settings').then(r=>r.ok?r.json():{}).then(s=>{
  const map = {ui_theme:'theme', ui_font:'font', ui_lang:'lang',
               ui_textSize:'textSize', ui_uiZoom:'uiZoom', ui_contentWidth:'contentWidth',
               ui_sidebar:'sidebar', ui_procPanel:'procPanel'};
  const A = {};
  for(const k in map) if(s[k]) A[map[k]] = s[k];
  if(A.font==='system'||A.font==='cjk') A.font = 'default';
  /* 折叠态先落到 html 上再渲染，否则启动会闪一下全宽侧栏 */
  document.documentElement.dataset.sidebar =
    A.sidebar==='collapsed' ? 'collapsed' : 'expanded';
  window.__FF_APPEARANCE = Object.assign(
    {lang:'zh', theme:'dark', font:'default',
     textSize:'m', uiZoom:'100%', contentWidth:'medium'}, A);
}).catch(()=>{ window.__FF_APPEARANCE = {}; });
</script>
</head>
<body>
<div class="titlebar">
  <div class="tlb-left pywebview-drag-region">
    <span class="tlb-brand"><img class="sb-logo" src="/static/logo-sm.svg?v=283aa713" alt=""><span
      class="sb-name" id="brandName">织流</span></span>
  </div>
  <div class="tlb-right">
    <div class="tlb-drag pywebview-drag-region"></div>
    <div class="tlb-acts">
      <button class="ic-btn" id="sbActBtn" data-tip-any="1" onclick="sbActivity(event)"></button>
      <button class="ic-btn" id="tbCollapse" data-tip-any="1" onclick="sbToggle()"></button>
    </div>
    <div class="tlb-win" id="tbWin" hidden>
      <button class="tlb-wb" id="winMin" data-tip-any="1" onclick="winMin()"></button>
      <button class="tlb-wb" id="winMax" data-tip-any="1" onclick="winMaxToggle()"></button>
      <button class="tlb-wb tlb-wclose" id="winClose" data-tip-any="1" onclick="winClose()"></button>
    </div>
  </div>
</div>
<div id="app" class="app">
  <aside class="sidebar">
    <div class="sb-scroll">
      <nav class="sb-nav" id="mainNav"></nav>
      <div id="sbLists"></div>
    </div>
    <div class="sb-foot">
      <button class="sb-me" id="sbMe" aria-expanded="false" aria-haspopup="true"
        aria-controls="sbPop" onclick="footMenu(event)">
        <span class="sb-me-av" id="sbMeAv"></span>
        <span class="sb-me-name" id="sbMeName">claude</span>
        <span class="sb-me-chev" id="sbMeChev"></span>
      </button>
      <button class="sb-update" id="sbUpdate" data-tip-any="1" hidden onclick="sbUpdateClick(event)"></button>
    </div>
  </aside>
  <div class="sb-pop" id="sbPop" hidden></div>
  <div class="sb-pop sb-pop-search" id="sbFind" hidden></div>
  <div class="up-mask" id="upMask" onclick="upClose()"></div>
  <div class="up-card" id="upCard" role="dialog" aria-modal="true" aria-labelledby="upHeadTtl" hidden></div>

  <main class="main">
    <header class="topbar">
      <div class="tb-title" id="tbTitle"></div>
      <div class="tb-actions" id="tbActions"></div>
    </header>
    <div class="container" id="view"></div>
  </main>
</div>

<div class="rz-layer" id="rzLayer" hidden>
  <i class="rz rz-n" data-edge="n"></i><i class="rz rz-s" data-edge="s"></i>
  <i class="rz rz-w" data-edge="w"></i><i class="rz rz-e" data-edge="e"></i>
  <i class="rz rz-nw" data-edge="nw"></i><i class="rz rz-ne" data-edge="ne"></i>
  <i class="rz rz-sw" data-edge="sw"></i><i class="rz rz-se" data-edge="se"></i>
</div>

<div class="ff-tip" id="ffTip" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/static/providers-catalog.js?v=283aa713"></script>
<script src="/static/ui.js?v=283aa713"></script>
<script src="/static/app.js?v=283aa713"></script>
<script src="/static/editor.js?v=283aa713"></script>
<script src="/static/run.js?v=283aa713"></script>
</body>
</html>
