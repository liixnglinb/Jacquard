<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-font="default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#181818">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=20261005">
<link rel="alternate icon" type="image/png" sizes="16x16" href="/static/favicon-16.png?v=20261005">
<link rel="alternate icon" type="image/png" sizes="32x32" href="/static/favicon-32.png?v=20261005">
<title>Jacquard 织流</title>
<link rel="stylesheet" href="/static/fonts/fonts.css">
<link rel="stylesheet" href="/static/style.css?v=20261005">
<link rel="stylesheet" href="/static/voyra-ui.css?v=20261005">
<script>
/* Voyra v11 · 阻断渲染的高优先外观启动器：从 localStorage 同步取回外观，
   在 DOM 解析页面主体前就把 data-theme / data-sidebar / --text-scale 打在 <html> 上，
   彻底根除深色模式下的 Webview 启动闪白。 */
(function() {
  try {
    const raw = localStorage.getItem('__FF_LOCAL_APPEARANCE');
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed.theme) document.documentElement.dataset.theme = parsed.theme;
      if (parsed.sidebar) document.documentElement.dataset.sidebar = parsed.sidebar;
      if (parsed.textSize) {
        const scaleMap = { s: '0.92', m: '1', l: '1.12', xl: '1.26' };
        document.documentElement.style.setProperty('--text-scale', scaleMap[parsed.textSize] || '1');
      }
    }
  } catch (_) {}
})();
/* 再向本地服务核对一次（异步兜底）：localStorage 与后端不一致时以服务端为准。 */
window.__FF_BOOT = fetch('/api/settings').then(r=>r.ok?r.json():{}).then(s=>{
  const map = {ui_theme:'theme', ui_font:'font', ui_lang:'lang',
               ui_textSize:'textSize', ui_uiZoom:'uiZoom', ui_contentWidth:'contentWidth',
               ui_sidebar:'sidebar', ui_procPanel:'procPanel'};
  const A = {};
  for(const k in map) if(s[k]) A[map[k]] = s[k];
  if(A.font==='system'||A.font==='cjk') A.font = 'default';
  /* 折叠态先落到 html 上再渲染，否则启动会闪一下全宽侧栏 */
  document.documentElement.dataset.sidebar =
    A.sidebar==='collapsed' ? 'collapsed' : 'expanded';
  window.__FF_APPEARANCE = Object.assign(
    {lang:'zh', theme:'dark', font:'default',
     textSize:'m', uiZoom:'100%', contentWidth:'medium'}, A);
}).catch(()=>{ window.__FF_APPEARANCE = {}; });
</script>
</head>
<body>
<div class="titlebar" id="appTitlebar">
  <div class="tlb-left pywebview-drag-region">
    <span class="tlb-brand"><img class="sb-logo" src="/static/logo-sm.svg?v=20261005" alt=""><span
      class="sb-name" id="brandName">织流 Jacquard</span></span>
  </div>
  <div class="tlb-right">
    <div class="tlb-drag pywebview-drag-region"></div>
    <div class="tlb-acts">
      <button class="ic-btn" id="sbActBtn" data-tip-any="1" onclick="sbActivity(event)" aria-label="活动状态"></button>
      <button class="ic-btn" id="tbCollapse" data-tip-any="1" onclick="sbToggle()" aria-label="切换侧栏 (Ctrl+B)"></button>
    </div>
    <div class="tlb-win" id="tbWin" hidden>
      <button class="tlb-wb" id="winMin" data-tip-any="1" onclick="winMin()" aria-label="最小化"></button>
      <button class="tlb-wb" id="winMax" data-tip-any="1" onclick="winMaxToggle()" aria-label="最大化"></button>
      <button class="tlb-wb tlb-wclose" id="winClose" data-tip-any="1" onclick="winClose()" aria-label="关闭"></button>
    </div>
  </div>
</div>
<div id="app" class="app">
  <aside class="sidebar">
    <div class="sb-scroll">
      <nav class="sb-nav" id="mainNav"></nav>
      <div id="sbLists"></div>
    </div>
    <div class="sb-foot">
      <button class="sb-me" id="sbMe" aria-expanded="false" aria-haspopup="true"
        aria-controls="sbPop" onclick="footMenu(event)">
        <span class="sb-me-av" id="sbMeAv"></span>
        <span class="sb-me-name" id="sbMeName">claude</span>
        <span class="sb-me-chev" id="sbMeChev"></span>
      </button>
      <button class="sb-update" id="sbUpdate" data-tip-any="1" hidden onclick="sbUpdateClick(event)"></button>
    </div>
  </aside>
  <div class="sb-pop" id="sbPop" hidden></div>
  <div class="sb-pop sb-pop-search" id="sbFind" hidden></div>
  <div class="up-mask" id="upMask" onclick="upClose()"></div>
  <div class="up-card" id="upCard" role="dialog" aria-modal="true" aria-labelledby="upHeadTtl" hidden></div>

  <main class="main">
    <header class="topbar">
      <div class="tb-title" id="tbTitle"></div>
      <div class="tb-actions" id="tbActions"></div>
    </header>
    <section class="workspace-state" id="workspaceState" hidden aria-label="页面读取状态">
      <div><strong id="workspaceStateTitle"></strong><p id="workspaceStateText"></p><small id="workspaceStateDetails"></small></div>
      <button type="button" class="btn btn-ghost" id="workspaceRetry">重新读取当前页</button>
    </section>
    <div class="container" id="view" aria-live="off"></div>
  </main>
</div>

<div class="rz-layer" id="rzLayer" hidden>
  <i class="rz rz-n" data-edge="n"></i><i class="rz rz-s" data-edge="s"></i>
  <i class="rz rz-w" data-edge="w"></i><i class="rz rz-e" data-edge="e"></i>
  <i class="rz rz-nw" data-edge="nw"></i><i class="rz rz-ne" data-edge="ne"></i>
  <i class="rz rz-sw" data-edge="sw"></i><i class="rz rz-se" data-edge="se"></i>
</div>

<div class="ff-tip" id="ffTip" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/static/providers-catalog.js?v=20261005"></script>
<script src="/static/ui.js?v=20261005"></script>
<script src="/static/voyra-ui.js?v=20261005"></script>
<script src="/static/app.js?v=20261005"></script>
<script src="/static/editor.js?v=20261005"></script>
<script src="/static/run.js?v=20261005"></script>
<script src="/static/voyra-dialogs.js?v=20261005"></script>
</body>
</html>
